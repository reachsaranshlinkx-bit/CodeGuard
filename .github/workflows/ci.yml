
name: CodeGuard Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality and Docker Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Ruff linting
        run: uv run ruff check src tests

      - name: Check Ruff formatting
        run: uv run ruff format --check src tests

      - name: Run Mypy
        run: uv run mypy src

      - name: Run Pytest
        run: uv run pytest -v

      # Docker validation
      - name: Create CI-only environment file
        working-directory: .
        run: |
          cat > backend/.env <<'EOF'
          CODEGUARD_ENVIRONMENT=testing
          CODEGUARD_GITHUB_TOKEN=ci-dummy-token-not-used
          CODEGUARD_API_KEY=ci-dummy-key-not-used
          CODEGUARD_ENABLE_REVIEW_PUBLISHING=false
          CODEGUARD_WEBHOOK_WORKER_ENABLED=false
          CODEGUARD_WEBHOOK_WORKER_POLL_INTERVAL_SECONDS=1
          EOF

      - name: Validate Docker Compose
        working-directory: .
        run: docker compose config --quiet

      - name: Build and start Docker container
        working-directory: .
        run: |
          docker compose up --build --detach --wait --wait-timeout 90

      - name: Test API health endpoint
        working-directory: .
        run: |
          curl --fail --show-error \
            http://127.0.0.1:8000/health

      - name: Show Docker logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color api || true

      - name: Stop Docker containers
        if: always()
        working-directory: .
        run: |
          docker compose down --volumes --remove-orphans
          rm -f backend/.env
