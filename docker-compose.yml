
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: codeguard-api

    env_file:
      - ./backend/.env

    environment:
      CODEGUARD_WEBHOOK_DATABASE_PATH: /data/webhook_deliveries.sqlite3

    volumes:
      - codeguard-data:/data

    ports:
      - "8000:8000"

    init: true
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine

    container_name: codeguard-postgres

    env_file:
      - ./backend/.env.postgres

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - codeguard-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    init: true
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

volumes:
  codeguard-data:
  codeguard-postgres-data:
