
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: codeguard-api

    env_file:
      - ./backend/.env
    environment:
      CODEGUARD_WEBHOOK_DATABASE_PATH: /data/webhook_deliveries.sqlite3

    volumes:
      - codeguard-data:/data

    ports:
      - "8000:8000"

    init: true

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codeguard-data: